<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاتحاد المغربي للشغل - قطاع الصحة ورزازات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0033a0;
            --primary-dark: #002277;
            --accent-color: #d32f2f;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.7;
            padding-bottom: 20px;
        }

        /* رأس الصفحة الفاخر */
        header {
            background: linear-gradient(135deg, #001f66 0%, #0033a0 100%);
            color: white;
            text-align: center;
            padding: 40px 20px 45px;
            box-shadow: 0 10px 25px -5px rgba(0, 51, 160, 0.25);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        /* تنسيق شعار النقابة */
        .header-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background: white;
            padding: 8px;
            border-radius: 50%;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            border: 3px solid #ffffff;
        }

        header h1 {
            font-size: 2.4em;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        header h2 {
            font-weight: 500;
            font-size: 1.25em;
            color: #e2e8f0;
            opacity: 0.95;
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 760px;
            margin: -20px auto 40px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* التصميم الجديد للبطاقات */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 0 1px 1px rgba(0, 0, 0, 0.02);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
